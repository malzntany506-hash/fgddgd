{% extends "base.html" %}

{% block title %}تسجيل ترقية{% endblock %}

{% block content %}
<div class="header-section">
    <div class="d-flex justify-content-between align-items-center">
        <div>
            <h2><i class="fas fa-arrow-up me-2"></i>تسجيل ترقية</h2>
            <p class="mb-0 opacity-75">تسجيل ترقية موظف جديدة</p>
        </div>
    </div>
</div>

<div class="card card-custom">
    <div class="card-body">
        <form method="POST">
            <div class="row g-4">
                <div class="col-md-6">
                    <label class="form-label">الموظف <span class="text-danger">*</span></label>
                    <select name="employee_id" class="form-select" required>
                        <option value="">اختر الموظف</option>
                        {% for emp in employees %}
                        <option value="{{ emp.id }}">{{ emp.full_name }} - {{ emp.position }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label">المنصب السابق</label>
                    <input type="text" name="old_position" class="form-control" placeholder="مثال: موظف">
                </div>

                <div class="col-md-6">
                    <label class="form-label">المنصب الجديد <span class="text-danger">*</span></label>
                    <input type="text" name="new_position" class="form-control" required placeholder="مثال: رئيس قسم">
                </div>

                <div class="col-md-3">
                    <label class="form-label">الراتب السابق</label>
                    <input type="number" name="old_salary" class="form-control" step="0.01" placeholder="0.00">
                </div>

                <div class="col-md-3">
                    <label class="form-label">الراتب الجديد</label>
                    <input type="number" name="new_salary" class="form-control" step="0.01" placeholder="0.00">
                </div>

                <div class="col-md-6">
                    <label class="form-label">تاريخ الترقية</label>
                    <input type="date" name="effective_date" class="form-control">
                </div>

                <div class="col-12">
                    <label class="form-label">ملاحظات</label>
                    <textarea name="reason" class="form-control" rows="3" placeholder="ملاحظات إضافية..."></textarea>
                </div>

                <div class="col-12">
                    <hr>
                    <div class="d-flex justify-content-end gap-2">
                        <button type="submit" class="btn btn-government">
                            <i class="fas fa-save me-2"></i>حفظ الترقية
                        </button>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
