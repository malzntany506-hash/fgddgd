{% extends "base.html" %}

{% block title %}إضافة مصروف{% endblock %}

{% block content %}
<div class="header-section">
    <div class="d-flex justify-content-between align-items-center">
        <div>
            <h2><i class="fas fa-plus-circle me-2"></i>إضافة مصروف جديد</h2>
            <p class="mb-0 opacity-75">تسجيل مصروف جديد</p>
        </div>
        <a href="{{ url_for('expenses_list') }}" class="btn btn-outline-light">
            <i class="fas fa-arrow-right me-2"></i>العودة
        </a>
    </div>
</div>

<div class="card card-custom">
    <div class="card-body">
        <form method="POST">
            <div class="row g-4">
                <div class="col-12">
                    <label class="form-label">الوصف <span class="text-danger">*</span></label>
                    <input type="text" name="description" class="form-control" required placeholder="وصف المصروف">
                </div>

                <div class="col-md-6">
                    <label class="form-label">المبلغ <span class="text-danger">*</span></label>
                    <input type="number" name="amount" class="form-control" step="0.01" required placeholder="0.00">
                </div>

                <div class="col-md-6">
                    <label class="form-label">نوع المصروف</label>
                    <select name="expense_type" class="form-select">
                        <option value="">اختر النوع</option>
                        <option value="operating">تشغيلية</option>
                        <option value="capital">رأسمالية</option>
                        <option value="payroll">رواتب</option>
                        <option value="maintenance">صيانة</option>
                        <option value="supplies">مستلزمات</option>
                        <option value="services">خدمات</option>
                        <option value="other">أخرى</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label">القسم</label>
                    <select name="department" class="form-select">
                        <option value="">اختر القسم</option>
                        <option value="الإدارة العامة">الإدارة العامة</option>
                        <option value="الشؤون المالية">الشؤون المالية</option>
                        <option value="شؤون الموظفين">شؤون الموظفين</option>
                        <option value="التقنية المعلومات">التقنية المعلومات</option>
                        <option value="الشؤون القانونية">الشؤون القانونية</option>
                        <option value="الخدمات العامة">الخدمات العامة</option>
                        <option value="المشاريع والإنشاءات">المشاريع والإنشاءات</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label">الجهة الموردة</label>
                    <input type="text" name="vendor" class="form-control" placeholder="اسم المورد">
                </div>

                <div class="col-md-6">
                    <label class="form-label">رقم الفاتورة</label>
                    <input type="text" name="invoice_number" class="form-control" placeholder="رقم الفاتورة">
                </div>

                <div class="col-12">
                    <hr>
                    <div class="d-flex justify-content-end gap-2">
                        <a href="{{ url_for('expenses_list') }}" class="btn btn-outline-government">إلغاء</a>
                        <button type="submit" class="btn btn-government">
                            <i class="fas fa-save me-2"></i>حفظ المصروف
                        </button>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
