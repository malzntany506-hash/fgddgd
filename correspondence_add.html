{% extends "base.html" %}

{% block title %}مراسلة جديدة{% endblock %}

{% block content %}
<div class="header-section">
    <div class="d-flex justify-content-between align-items-center">
        <div>
            <h2><i class="fas fa-envelope me-2"></i>مراسلة جديدة</h2>
            <p class="mb-0 opacity-75">تسجيل معاملة مراسلة جديدة</p>
        </div>
        <a href="{{ url_for('correspondence_list') }}" class="btn btn-outline-light">
            <i class="fas fa-arrow-right me-2"></i>العودة للقائمة
        </a>
    </div>
</div>

<div class="card card-custom">
    <div class="card-body">
        <form method="POST" enctype="multipart/form-data">
            <div class="row g-4">
                <div class="col-md-6">
                    <label class="form-label">نوع المراسلة <span class="text-danger">*</span></label>
                    <select name="doc_type" class="form-select" required>
                        <option value="">اختر النوع</option>
                        <option value="incoming">وارد</option>
                        <option value="outgoing">صادر</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label">الأولوية</label>
                    <select name="priority" class="form-select">
                        <option value="normal">عادي</option>
                        <option value="high">مرتفع</option>
                        <option value="urgent">عاجل</option>
                    </select>
                </div>

                <div class="col-12">
                    <label class="form-label">الموضوع <span class="text-danger">*</span></label>
                    <input type="text" name="subject" class="form-control" required placeholder="أدخل موضوع المراسلة">
                </div>

                <div class="col-md-6">
                    <label class="form-label">المرسل <span class="text-danger">*</span></label>
                    <input type="text" name="sender" class="form-control" required placeholder="اسم المرسل / الجهة">
                </div>

                <div class="col-md-6">
                    <label class="form-label">المستلم</label>
                    <input type="text" name="recipient" class="form-control" placeholder="اسم المستلم / الجهة">
                </div>

                <div class="col-md-6">
                    <label class="form-label">تاريخ الاستحقاق</label>
                    <input type="date" name="due_date" class="form-control">
                </div>

                <div class="col-md-6">
                    <label class="form-label">المرفقات</label>
                    <input type="file" name="attachment" class="form-control">
                    <small class="text-muted">PDF, DOC, DOCX, JPG, PNG, XLS, XLSX (حد أقصى 16 MB)</small>
                </div>

                <div class="col-12">
                    <label class="form-label">محتوى المراسلة</label>
                    <textarea name="content" class="form-control" rows="6" placeholder="أدخل تفاصيل المراسلة..."></textarea>
                </div>

                <div class="col-12">
                    <hr>
                    <div class="d-flex justify-content-end gap-2">
                        <a href="{{ url_for('correspondence_list') }}" class="btn btn-outline-government">إلغاء</a>
                        <button type="submit" class="btn btn-government">
                            <i class="fas fa-save me-2"></i>حفظ المراسلة
                        </button>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
