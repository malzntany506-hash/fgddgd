{% extends "base.html" %}

{% block title %}تسجيل مخالفة{% endblock %}

{% block content %}
<div class="header-section">
    <div class="d-flex justify-content-between align-items-center">
        <div>
            <h2><i class="fas fa-gavel me-2"></i>تسجيل مخالفة</h2>
            <p class="mb-0 opacity-75">تسجيل مخالفة تأديبية لموظف</p>
        </div>
    </div>
</div>

<div class="card card-custom">
    <div class="card-body">
        <form method="POST">
            <div class="row g-4">
                <div class="col-md-6">
                    <label class="form-label">الموظف <span class="text-danger">*</span></label>
                    <select name="employee_id" class="form-select" required>
                        <option value="">اختر الموظف</option>
                        {% for emp in employees %}
                        <option value="{{ emp.id }}">{{ emp.full_name }} - {{ emp.department }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label">نوع المخالفة <span class="text-danger">*</span></label>
                    <input type="text" name="violation_type" class="form-control" required placeholder="مثال: التأخر عن الدوام">
                </div>

                <div class="col-md-6">
                    <label class="form-label">الجزاء</label>
                    <input type="text" name="penalty" class="form-control" placeholder="مثال: خصم يوم">
                </div>

                <div class="col-md-6">
                    <label class="form-label">تاريخ المخالفة</label>
                    <input type="date" name="penalty_date" class="form-control">
                </div>

                <div class="col-12">
                    <label class="form-label">تفاصيل المخالفة</label>
                    <textarea name="description" class="form-control" rows="4" placeholder="أدخل تفاصيل المخالفة..."></textarea>
                </div>

                <div class="col-12">
                    <hr>
                    <div class="d-flex justify-content-end gap-2">
                        <button type="submit" class="btn btn-government">
                            <i class="fas fa-save me-2"></i>حفظ المخالفة
                        </button>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
