{% extends "base.html" %}

{% block title %}إضافة مادة{% endblock %}

{% block content %}
<div class="header-section">
    <div class="d-flex justify-content-between align-items-center">
        <div>
            <h2><i class="fas fa-box me-2"></i>إضافة مادة جديدة</h2>
            <p class="mb-0 opacity-75">تسجيل مادة جديدة في المخزون</p>
        </div>
        <a href="{{ url_for('inventory_list') }}" class="btn btn-outline-light">
            <i class="fas fa-arrow-right me-2"></i>العودة
        </a>
    </div>
</div>

<div class="card card-custom">
    <div class="card-body">
        <form method="POST">
            <div class="row g-4">
                <div class="col-md-6">
                    <label class="form-label">اسم المادة <span class="text-danger">*</span></label>
                    <input type="text" name="item_name" class="form-control" required placeholder="أدخل اسم المادة">
                </div>

                <div class="col-md-6">
                    <label class="form-label">الفئة</label>
                    <select name="category" class="form-select">
                        <option value="">اختر الفئة</option>
                        <option value="office">قرطاسية</option>
                        <option value="electronics">إلكترونيات</option>
                        <option value="cleaning">تنظيف</option>
                        <option value="maintenance">صيانة</option>
                        <option value="other">أخرى</option>
                    </select>
                </div>

                <div class="col-md-4">
                    <label class="form-label">الكمية</label>
                    <input type="number" name="quantity" class="form-control" value="0" placeholder="0">
                </div>

                <div class="col-md-4">
                    <label class="form-label">الحد الأدنى للكمية</label>
                    <input type="number" name="min_quantity" class="form-control" value="0" placeholder="0">
                </div>

                <div class="col-md-4">
                    <label class="form-label">الوحدة</label>
                    <input type="text" name="unit" class="form-control" placeholder="مثال: علبة، قطع">
                </div>

                <div class="col-md-6">
                    <label class="form-label">الموقع</label>
                    <input type="text" name="location" class="form-control" placeholder="موقع التخزين">
                </div>

                <div class="col-12">
                    <hr>
                    <div class="d-flex justify-content-end gap-2">
                        <a href="{{ url_for('inventory_list') }}" class="btn btn-outline-government">إلغاء</a>
                        <button type="submit" class="btn btn-government">
                            <i class="fas fa-save me-2"></i>حفظ المادة
                        </button>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
