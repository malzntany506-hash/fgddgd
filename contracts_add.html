{% extends "base.html" %}

{% block title %}إضافة عقد{% endblock %}

{% block content %}
<div class="header-section">
    <div class="d-flex justify-content-between align-items-center">
        <div>
            <h2><i class="fas fa-file-signature me-2"></i>إضافة عقد جديد</h2>
            <p class="mb-0 opacity-75">تسجيل عقد جديد</p>
        </div>
        <a href="{{ url_for('contracts_list') }}" class="btn btn-outline-light">
            <i class="fas fa-arrow-right me-2"></i>العودة
        </a>
    </div>
</div>

<div class="card card-custom">
    <div class="card-body">
        <form method="POST">
            <div class="row g-4">
                <div class="col-md-6">
                    <label class="form-label">نوع العقد</label>
                    <select name="contract_type" class="form-select">
                        <option value="">اختر النوع</option>
                        <option value="supply">توريد</option>
                        <option value="service">خدمات</option>
                        <option value="construction">إنشاءات</option>
                        <option value="consulting">استشارات</option>
                        <option value="rental">إيجار</option>
                        <option value="other">أخرى</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label">اسم المتعاقد <span class="text-danger">*</span></label>
                    <input type="text" name="contractor_name" class="form-control" required placeholder="اسم الشركة أو الشخص">
                </div>

                <div class="col-12">
                    <label class="form-label">موضوع العقد</label>
                    <input type="text" name="subject" class="form-control" placeholder="وصف موجز للعقد">
                </div>

                <div class="col-md-6">
                    <label class="form-label">تاريخ البدء</label>
                    <input type="date" name="start_date" class="form-control">
                </div>

                <div class="col-md-6">
                    <label class="form-label">تاريخ الانتهاء</label>
                    <input type="date" name="end_date" class="form-control">
                </div>

                <div class="col-md-6">
                    <label class="form-label">قيمة العقد</label>
                    <input type="number" name="value" class="form-control" step="0.01" placeholder="0.00">
                </div>

                <div class="col-12">
                    <label class="form-label">ملاحظات</label>
                    <textarea name="notes" class="form-control" rows="3" placeholder="ملاحظات إضافية..."></textarea>
                </div>

                <div class="col-12">
                    <hr>
                    <div class="d-flex justify-content-end gap-2">
                        <a href="{{ url_for('contracts_list') }}" class="btn btn-outline-government">إلغاء</a>
                        <button type="submit" class="btn btn-government">
                            <i class="fas fa-save me-2"></i>حفظ العقد
                        </button>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
