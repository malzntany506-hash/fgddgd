{% extends "base.html" %}

{% block title %}تعديل بيانات الموظف{% endblock %}

{% block content %}
<div class="header-section">
    <div class="d-flex justify-content-between align-items-center">
        <div>
            <h2><i class="fas fa-edit me-2"></i>تعديل بيانات الموظف</h2>
            <p class="mb-0 opacity-75">{{ employee.full_name }}</p>
        </div>
        <a href="{{ url_for('employees_view', id=employee.id) }}" class="btn btn-outline-light">
            <i class="fas fa-arrow-right me-2"></i>العودة
        </a>
    </div>
</div>

<div class="card card-custom">
    <div class="card-body">
        <form method="POST">
            <div class="row g-4">
                <div class="col-md-6">
                    <label class="form-label">الاسم الكامل <span class="text-danger">*</span></label>
                    <input type="text" name="full_name" class="form-control" required value="{{ employee.full_name }}">
                </div>

                <div class="col-md-6">
                    <label class="form-label">رقم الهوية</label>
                    <input type="text" name="national_id" class="form-control" value="{{ employee.national_id }}">
                </div>

                <div class="col-md-6">
                    <label class="form-label">تاريخ الميلاد</label>
                    <input type="date" name="birth_date" class="form-control" value="{{ employee.birth_date.strftime('%Y-%m-%d') if employee.birth_date else '' }}">
                </div>

                <div class="col-md-4">
                    <label class="form-label">الجنس</label>
                    <select name="gender" class="form-select">
                        <option value="">اختر</option>
                        <option value="male" {% if employee.gender == 'male' %}selected{% endif %}>ذكر</option>
                        <option value="female" {% if employee.gender == 'female' %}selected{% endif %}>أنثى</option>
                    </select>
                </div>

                <div class="col-md-4">
                    <label class="form-label">الحالة الاجتماعية</label>
                    <select name="marital_status" class="form-select">
                        <option value="">اختر</option>
                        <option value="single" {% if employee.marital_status == 'single' %}selected{% endif %}>أعزب</option>
                        <option value="married" {% if employee.marital_status == 'married' %}selected{% endif %}>متزوج</option>
                        <option value="divorced" {% if employee.marital_status == 'divorced' %}selected{% endif %}>مطلق</option>
                        <option value="widowed" {% if employee.marital_status == 'widowed' %}selected{% endif %}>أرمل</option>
                    </select>
                </div>

                <div class="col-md-4">
                    <label class="form-label">رقم الهاتف</label>
                    <input type="text" name="phone" class="form-control" value="{{ employee.phone }}">
                </div>

                <div class="col-md-6">
                    <label class="form-label">البريد الإلكتروني</label>
                    <input type="email" name="email" class="form-control" value="{{ employee.email }}">
                </div>

                <div class="col-12">
                    <label class="form-label">العنوان</label>
                    <input type="text" name="address" class="form-control" value="{{ employee.address }}">
                </div>

                <div class="col-md-6">
                    <label class="form-label">القسم</label>
                    <select name="department" class="form-select">
                        <option value="">اختر القسم</option>
                        <option value="الإدارة العامة" {% if employee.department == 'الإدارة العامة' %}selected{% endif %}>الإدارة العامة</option>
                        <option value="الشؤون المالية" {% if employee.department == 'الشؤون المالية' %}selected{% endif %}>الشؤون المالية</option>
                        <option value="شؤون الموظفين" {% if employee.department == 'شؤون الموظفين' %}selected{% endif %}>شؤون الموظفين</option>
                        <option value="التقنية المعلومات" {% if employee.department == 'التقنية المعلومات' %}selected{% endif %}>التقنية المعلومات</option>
                        <option value="الشؤون القانونية" {% if employee.department == 'الشؤون القانونية' %}selected{% endif %}>الشؤون القانونية</option>
                        <option value="الخدمات العامة" {% if employee.department == 'الخدمات العامة' %}selected{% endif %}>الخدمات العامة</option>
                        <option value="المشاريع والإنشاءات" {% if employee.department == 'المشاريع والإنشاءات' %}selected{% endif %}>المشاريع والإنشاءات</option>
                        <option value="الشؤون الإدارية" {% if employee.department == 'الشؤون الإدارية' %}selected{% endif %}>الشؤون الإدارية</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label">المنصب</label>
                    <input type="text" name="position" class="form-control" value="{{ employee.position }}">
                </div>

                <div class="col-md-6">
                    <label class="form-label">نوع العقد</label>
                    <select name="contract_type" class="form-select">
                        <option value="">اختر</option>
                        <option value="دائم" {% if employee.contract_type == 'دائم' %}selected{% endif %}>دائم</option>
                        <option value="مؤقت" {% if employee.contract_type == 'مؤقت' %}selected{% endif %}>مؤقت</option>
                        <option value="عرضي" {% if employee.contract_type == 'عرضي' %}selected{% endif %}>عرضي</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label">الراتب الأساسي</label>
                    <input type="number" name="salary" class="form-control" step="0.01" value="{{ employee.salary }}">
                </div>

                <div class="col-12">
                    <hr>
                    <div class="d-flex justify-content-end gap-2">
                        <a href="{{ url_for('employees_view', id=employee.id) }}" class="btn btn-outline-government">إلغاء</a>
                        <button type="submit" class="btn btn-government">
                            <i class="fas fa-save me-2"></i>حفظ التعديلات
                        </button>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
